[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pyfilechoose"
version = "0.1.0"
description = "A simple replication of R's file.choose() for Python."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [
  { name = "Jonathan Katende Pinto", email = "katendepinto@gmail.com" },
]
keywords = ["file", "dialog", "tkinter", "file.choose", "R", "filedialog"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: User Interfaces",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/katendepinto/pyfilechoose"
Repository = "https://github.com/katendepinto/pyfilechoose"
Issues = "https://github.com/katendepinto/pyfilechoose/issues"
Changelog = "https://github.com/katendepinto/pyfilechoose/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pyfilechoose = ["py.typed"]
