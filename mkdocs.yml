site_name: pyfilechoose
site_description: R's file.choose(), reimplemented for Python.
site_author: Jonathan Katende Pinto
repo_url: https://github.com/Pinto-Katende-Jonathan/pyfilechoose
repo_name: Pinto-Katende-Jonathan/pyfilechoose

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - toc.integrate

nav:
  - Home: index.md
  - Installation: installation.md
  - Usage: usage.md
  - API reference: api.md
  - How it works: internals.md
  - Troubleshooting: troubleshooting.md
  - Development: development.md
  - Changelog: changelog.md

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: numpy
            show_source: true
            show_root_heading: true
